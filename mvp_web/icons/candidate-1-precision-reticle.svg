<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Halo Glow Gradient -->
    <linearGradient id="halo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Caliper Metallic Ring -->
    <linearGradient id="ring-metal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-reticle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad-1)" stroke="#1e293b" stroke-width="3" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(45, 212, 191, 0.12)" stroke-width="2" />

  <!-- Outer Petri Dish Guide -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Halo Ring with Intense Teal Glow -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#halo-cyan)" stroke-width="20" stroke-linecap="round" filter="url(#glow-reticle)" opacity="0.9" />

  <!-- Inner Concentric Lens Guide -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Precision Reticle Crosshairs with Measurement Notches -->
  <!-- Horizontal Axis -->
  <line x1="86" y1="256" x2="180" y2="256" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
  <line x1="332" y1="256" x2="426" y2="256" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
  <!-- Vertical Axis -->
  <line x1="256" y1="86" x2="256" y2="180" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="332" x2="256" y2="426" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

  <!-- Reticle Caliper Ticks (5 mm sub-divisions) -->
  <line x1="216" y1="246" x2="216" y2="266" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="296" y1="246" x2="296" y2="266" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="246" y1="216" x2="266" y2="216" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="246" y1="296" x2="266" y2="296" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Central Micro Crosshair and Fiducial Dot -->
  <circle cx="256" cy="256" r="14" fill="#042f2e" stroke="#2dd4bf" stroke-width="3" />
  <circle cx="256" cy="256" r="4" fill="#5eead4" />
</svg>
