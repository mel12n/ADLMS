<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-refined" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1420" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Titanium Monogram D Border -->
    <linearGradient id="metal-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Blade Gradients with specular metallic edge -->
    <linearGradient id="blade-metal-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="blade-metal-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="60%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>

    <!-- Bio-Halo Core Glow -->
    <radialGradient id="halo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="1" />
      <stop offset="45%" stop-color="#2dd4bf" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Disc Center -->
    <radialGradient id="disc-center" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Lens Flare Coating -->
    <linearGradient id="lens-coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <filter id="halo-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-refined)" stroke="#1e293b" stroke-width="3" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(45, 212, 191, 0.12)" stroke-width="2" />

  <!-- Monogram D Chassis (Outer Lens Barrel) -->
  <path d="M 120 90 L 260 90 C 362 90 424 162 424 256 C 424 350 362 422 260 422 L 120 422 Z"
        fill="#080e18" stroke="url(#metal-d)" stroke-width="18" stroke-linejoin="round" />

  <!-- Precision Etched Ticks on D Barrel -->
  <g stroke="rgba(203, 213, 225, 0.4)" stroke-linecap="round" stroke-width="2.5">
    <line x1="120" y1="125" x2="140" y2="125" />
    <line x1="120" y1="160" x2="135" y2="160" />
    <line x1="120" y1="195" x2="140" y2="195" />
    <line x1="120" y1="230" x2="135" y2="230" />
    <line x1="120" y1="256" x2="145" y2="256" stroke="#2dd4bf" stroke-width="3.5" />
    <line x1="120" y1="282" x2="135" y2="282" />
    <line x1="120" y1="317" x2="140" y2="317" />
    <line x1="120" y1="352" x2="135" y2="352" />
    <line x1="120" y1="387" x2="140" y2="387" />
  </g>

  <!-- Diaphragm Assembly (Centered at Lens Optical Axis X: 272, Y: 256) -->
  <g transform="translate(272, 256)">
    <!-- Outer Lens Ring Bezel with Caliper Ticks -->
    <circle cx="0" cy="0" r="142" fill="#040810" stroke="#1e293b" stroke-width="5" />
    <circle cx="0" cy="0" r="136" fill="none" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1.5" stroke-dasharray="4 6" />

    <!-- Cyan Luminous Glow Ring behind the Aperture Blades -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="#2dd4bf" stroke-width="6" opacity="0.4" filter="url(#halo-blur)" />

    <!-- 6 Curved Diaphragm Blades (Rotated 60 deg each) -->
    <!-- Blade 1 -->
    <path d="M 0,-130 C 50,-130 115,-80 120,-30 C 90,-45 40,-40 10,-25 C -5,-45 -10,-90 0,-130 Z"
          fill="url(#blade-metal-1)" stroke="#374151" stroke-width="1.5" />
    <!-- Blade 2 -->
    <path d="M 0,-130 C 50,-130 115,-80 120,-30 C 90,-45 40,-40 10,-25 C -5,-45 -10,-90 0,-130 Z"
          transform="rotate(60)" fill="url(#blade-metal-2)" stroke="#4b5563" stroke-width="1.5" />
    <!-- Blade 3 -->
    <path d="M 0,-130 C 50,-130 115,-80 120,-30 C 90,-45 40,-40 10,-25 C -5,-45 -10,-90 0,-130 Z"
          transform="rotate(120)" fill="url(#blade-metal-1)" stroke="#374151" stroke-width="1.5" />
    <!-- Blade 4 -->
    <path d="M 0,-130 C 50,-130 115,-80 120,-30 C 90,-45 40,-40 10,-25 C -5,-45 -10,-90 0,-130 Z"
          transform="rotate(180)" fill="url(#blade-metal-2)" stroke="#4b5563" stroke-width="1.5" />
    <!-- Blade 5 -->
    <path d="M 0,-130 C 50,-130 115,-80 120,-30 C 90,-45 40,-40 10,-25 C -5,-45 -10,-90 0,-130 Z"
          transform="rotate(240)" fill="url(#blade-metal-1)" stroke="#374151" stroke-width="1.5" />
    <!-- Blade 6 -->
    <path d="M 0,-130 C 50,-130 115,-80 120,-30 C 90,-45 40,-40 10,-25 C -5,-45 -10,-90 0,-130 Z"
          transform="rotate(300)" fill="url(#blade-metal-2)" stroke="#4b5563" stroke-width="1.5" />

    <!-- Central Aperture Pupil: The Glowing Inhibition Halo -->
    <circle cx="0" cy="0" r="54" fill="url(#halo-glow)" filter="url(#halo-blur)" />
    <circle cx="0" cy="0" r="44" fill="#042f2e" stroke="#2dd4bf" stroke-width="2" />

    <!-- Central Antibiotic Disc (6 mm) -->
    <circle cx="0" cy="0" r="22" fill="url(#disc-center)" stroke="#f8fafc" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#0f172a" />

    <!-- Optical Multi-Coated Lens Reflection Sheen (Anti-reflective violet/cyan glare) -->
    <circle cx="0" cy="0" r="132" fill="url(#lens-coat)" pointer-events="none" />
  </g>
</svg>
