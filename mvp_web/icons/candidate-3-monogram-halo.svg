<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091420" />
      <stop offset="100%" stop-color="#020610" />
    </linearGradient>

    <!-- Monogram D Gradient -->
    <linearGradient id="mono-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Aperture Blade Fill -->
    <linearGradient id="blade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3e" />
      <stop offset="100%" stop-color="#071b28" />
    </linearGradient>

    <filter id="d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad-3)" stroke="#1e293b" stroke-width="3" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(45, 212, 191, 0.12)" stroke-width="2" />

  <!-- Circular Dial Measurement Ticks (360 degrees) -->
  <g stroke="rgba(148, 163, 184, 0.45)" stroke-linecap="round" stroke-width="2.5">
    <!-- Main Cardinal Ticks -->
    <line x1="256" y1="62" x2="256" y2="82" stroke="#2dd4bf" stroke-width="4" />
    <line x1="256" y1="430" x2="256" y2="450" stroke="#2dd4bf" stroke-width="4" />
    <line x1="62" y1="256" x2="82" y2="256" stroke="#2dd4bf" stroke-width="4" />
    <line x1="430" y1="256" x2="450" y2="256" stroke="#2dd4bf" stroke-width="4" />

    <!-- 30 deg ticks -->
    <line x1="353" y1="88" x2="343" y2="105" />
    <line x1="424" y1="159" x2="407" y2="169" />
    <line x1="424" y1="353" x2="407" y2="343" />
    <line x1="353" y1="424" x2="343" y2="407" />
    <line x1="159" y1="424" x2="169" y2="407" />
    <line x1="88" y1="353" x2="105" y2="343" />
    <line x1="88" y1="159" x2="105" y2="169" />
    <line x1="159" y1="88" x2="169" y2="105" />
  </g>

  <!-- Big Stylized 'D' Monogram with Aperture Center -->
  <!-- Outer D Path -->
  <path d="M 148 116 L 270 116 C 352 116 406 172 406 256 C 406 340 352 396 270 396 L 148 396 Z"
        fill="none" stroke="url(#mono-cyan)" stroke-width="28" stroke-linejoin="round" filter="url(#d-glow)" />

  <!-- Inner Aperture / Camera Lens Blades (The Deep Learning Optical Eye) -->
  <g transform="translate(270, 256)">
    <!-- Aperture Outer Ring -->
    <circle cx="0" cy="0" r="66" fill="url(#blade-grad)" stroke="#38bdf8" stroke-width="3" />
    <!-- 6 Iris Blades -->
    <polygon points="0,-64 36,-30 18,-6" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <polygon points="55,-32 55,18 28,10" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <polygon points="55,32 18,52 10,24" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <polygon points="0,64 -36,30 -18,6" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <polygon points="-55,32 -55,-18 -28,-10" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <polygon points="-55,-32 -18,-52 -10,-24" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <!-- Center Pupil Aperture -->
    <circle cx="0" cy="0" r="16" fill="#0284c7" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>
</svg>
