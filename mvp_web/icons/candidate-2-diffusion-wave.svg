<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Metallic Disc Radial Gradient -->
    <radialGradient id="disc-metal" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Wave Glow Filter -->
    <filter id="wave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="wave-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad-2)" stroke="#1e293b" stroke-width="3" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" />

  <!-- Wave 3 (Outer diffusion boundary) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#wave-grad-3)" stroke-width="8" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Wave 2 (Middle inhibition halo) -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#wave-grad-2)" stroke-width="12" filter="url(#wave-glow)" opacity="0.8" />

  <!-- Wave 1 (Inner intense clearance zone) -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="url(#wave-grad-1)" stroke-width="14" filter="url(#wave-glow)" />

  <!-- Central Antibiotic Disc (6 mm paper disc with bevel & drop shadow) -->
  <circle cx="256" cy="258" r="46" fill="rgba(0,0,0,0.5)" filter="url(#wave-glow)" />
  <circle cx="256" cy="256" r="44" fill="url(#disc-metal)" stroke="#f1f5f9" stroke-width="2.5" />
  <circle cx="256" cy="256" r="32" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Subtle Radial Tick Marks on the Disc -->
  <circle cx="256" cy="256" r="5" fill="#1e293b" />
</svg>
