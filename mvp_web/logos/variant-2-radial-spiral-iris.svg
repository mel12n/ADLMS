<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Bezel Ring with Aperture Dial Ticks -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3" />
  
  <!-- Optical Axis Center Group -->
  <g transform="translate(50, 50)">
    <!-- 8 Logarithmic Curved Blades -->
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(45)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(135)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(180)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(225)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(270)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -38 C 16 -38 32 -26 35 -12 C 24 -15 12 -12 4 -5 C -1 -15 -2 -28 0 -38 Z"
          transform="rotate(315)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Aperture Opening -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="currentColor" stroke-width="2.5" />
    <circle cx="0" cy="0" r="4" fill="currentColor" />
  </g>

  <!-- Left Focal Plane Bracket (evoking the stem of 'D') -->
  <line x1="8" y1="20" x2="8" y2="80" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
  <line x1="8" y1="20" x2="20" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="8" y1="80" x2="20" y2="80" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
</svg>
