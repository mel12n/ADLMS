<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Left Solid Vertical Stem of 'D' -->
  <rect x="16" y="16" width="9" height="68" rx="4.5" fill="currentColor" />

  <!-- Diaphragm Blades Radiating in Asymmetrical Rhythm forming the 'D' bowl -->
  <g transform="translate(52, 50)">
    <!-- 6 Interlocking Blades with varying thickness to trace the D curve -->
    <!-- Top Horizontal Blade -->
    <path d="M -24 -34 L 10 -34 C 24 -34 34 -20 34 -6 L 22 -6 C 22 -14 16 -22 6 -22 L -24 -22 Z" fill="currentColor" />
    
    <!-- Diagonal Upper Blade -->
    <path d="M 12 -28 L 32 -10 L 26 -2 L 8 -18 Z" fill="currentColor" />
    
    <!-- Rightmost Curvature Blade -->
    <path d="M 34 -6 C 36 10 26 26 12 34 L 6 24 C 18 18 24 6 22 -6 Z" fill="currentColor" />
    
    <!-- Diagonal Lower Blade -->
    <path d="M 28 14 L 10 32 L 2 24 L 20 6 Z" fill="currentColor" />
    
    <!-- Bottom Horizontal Blade -->
    <path d="M 10 34 L -24 34 L -24 22 L 6 22 C 16 22 22 14 22 6 L 34 6 C 34 20 24 34 10 34 Z" fill="currentColor" />
    
    <!-- Internal Iris Aperture Core -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="currentColor" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="currentColor" />
  </g>
</svg>
