<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Central Lens Barrel -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="3" />
  <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3" />

  <!-- 6 Diaphragm Aperture Blades -->
  <g transform="translate(50, 50)">
    <path d="M 0 -32 L 16 -16 L 8 -8 L -8 -24 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -32 L 16 -16 L 8 -8 L -8 -24 Z" transform="rotate(60)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -32 L 16 -16 L 8 -8 L -8 -24 Z" transform="rotate(120)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -32 L 16 -16 L 8 -8 L -8 -24 Z" transform="rotate(180)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -32 L 16 -16 L 8 -8 L -8 -24 Z" transform="rotate(240)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -32 L 16 -16 L 8 -8 L -8 -24 Z" transform="rotate(300)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Central Pupil -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="currentColor" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2.5" fill="currentColor" />
  </g>

  <!-- Caliper Reticle Crosshairs (Measurement axes) -->
  <line x1="8" y1="50" x2="22" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="78" y1="50" x2="92" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="8" x2="50" y2="22" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="78" x2="50" y2="92" stroke="currentColor" stroke-width="3" stroke-linecap="round" />

  <!-- Caliper Measurement Ticks -->
  <line x1="14" y1="46" x2="14" y2="54" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="46" x2="86" y2="54" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <line x1="46" y1="14" x2="54" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <line x1="46" y1="86" x2="54" y2="86" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

  <!-- D Monogram Arc (Top-Right to Bottom-Right) -->
  <path d="M 22 20 L 50 20 C 72 20 86 32 86 50 C 86 68 72 80 50 80 L 22 80"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-dasharray="4 4" />
</svg>
