<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-v1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Outer Monogram D Barrel -->
  <path d="M 18 16 L 48 16 C 70 16 84 30 84 50 C 84 70 70 84 48 84 L 18 84 Z"
        fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Diaphragm Iris Assembly (Centered at Lens Axis X: 52, Y: 50) -->
  <g transform="translate(52, 50)">
    <!-- Lens Rim -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="currentColor" stroke-width="2.5" />

    <!-- 6 Diaphragm Blades -->
    <path d="M 0 -24 L 12 -12 L 5 -5 L -8 -16 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -24 L 12 -12 L 5 -5 L -8 -16 Z" transform="rotate(60)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -24 L 12 -12 L 5 -5 L -8 -16 Z" transform="rotate(120)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -24 L 12 -12 L 5 -5 L -8 -16 Z" transform="rotate(180)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -24 L 12 -12 L 5 -5 L -8 -16 Z" transform="rotate(240)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -24 L 12 -12 L 5 -5 L -8 -16 Z" transform="rotate(300)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

    <!-- Central Aperture Pupil (Fiducial Disc) -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="currentColor" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2.2" fill="currentColor" />
  </g>
</svg>
