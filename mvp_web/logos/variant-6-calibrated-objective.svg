<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Calibrated Lens Dial with 12 Fiducial Ticks -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="2.5" />
  
  <!-- Dial Ticks (30 deg increments) -->
  <g stroke="currentColor" stroke-linecap="round" stroke-width="1.8">
    <line x1="50" y1="10" x2="50" y2="15" stroke-width="2.8" />
    <line x1="70" y1="15.4" x2="67.5" y2="19.7" />
    <line x1="84.6" y1="30" x2="80.3" y2="32.5" />
    <line x1="90" y1="50" x2="85" y2="50" stroke-width="2.8" />
    <line x1="84.6" y1="70" x2="80.3" y2="67.5" />
    <line x1="70" y1="84.6" x2="67.5" y2="80.3" />
    <line x1="50" y1="90" x2="50" y2="85" stroke-width="2.8" />
    <line x1="30" y1="84.6" x2="32.5" y2="80.3" />
    <line x1="15.4" y1="70" x2="19.7" y2="67.5" />
    <line x1="10" y1="50" x2="15" y2="50" stroke-width="2.8" />
    <line x1="15.4" y1="30" x2="19.7" y2="32.5" />
    <line x1="30" y1="15.4" x2="32.5" y2="19.7" />
  </g>

  <!-- Inner Barrel Ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="currentColor" stroke-width="2.5" />

  <!-- 6 Overlapping Mechanical Aperture Blades -->
  <g transform="translate(50, 50)">
    <path d="M 0 -28 C 12 -28 24 -18 26 -6 C 18 -10 8 -8 2 -2 C -1 -10 -2 -20 0 -28 Z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -28 C 12 -28 24 -18 26 -6 C 18 -10 8 -8 2 -2 C -1 -10 -2 -20 0 -28 Z"
          transform="rotate(60)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -28 C 12 -28 24 -18 26 -6 C 18 -10 8 -8 2 -2 C -1 -10 -2 -20 0 -28 Z"
          transform="rotate(120)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -28 C 12 -28 24 -18 26 -6 C 18 -10 8 -8 2 -2 C -1 -10 -2 -20 0 -28 Z"
          transform="rotate(180)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -28 C 12 -28 24 -18 26 -6 C 18 -10 8 -8 2 -2 C -1 -10 -2 -20 0 -28 Z"
          transform="rotate(240)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 -28 C 12 -28 24 -18 26 -6 C 18 -10 8 -8 2 -2 C -1 -10 -2 -20 0 -28 Z"
          transform="rotate(300)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Pupil (6 mm Antibiotic Disc Fiducial) -->
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="currentColor" stroke-width="2.2" />
    <circle cx="0" cy="0" r="3" fill="currentColor" />
  </g>
</svg>
