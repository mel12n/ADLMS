<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Structural 'D' Monogram with Chamfered Corners -->
  <path d="M 16 18 L 46 18 C 68 18 82 32 82 50 C 82 68 68 82 46 82 L 16 82 Z"
        fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Diaphragm + Halo Center -->
  <g transform="translate(48, 50)">
    <!-- Inhibition Halo Outer Boundary (Dashed/Dotted biological clearance zone) -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.85" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="currentColor" stroke-width="2.5" />

    <!-- 6 Mechanical Shutter Blades framing the Halo -->
    <polygon points="0,-22 14,-14 6,-6 -4,-16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="0,-22 14,-14 6,-6 -4,-16" transform="rotate(60)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="0,-22 14,-14 6,-6 -4,-16" transform="rotate(120)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="0,-22 14,-14 6,-6 -4,-16" transform="rotate(180)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="0,-22 14,-14 6,-6 -4,-16" transform="rotate(240)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="0,-22 14,-14 6,-6 -4,-16" transform="rotate(300)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Center 6 mm Antibiotic Disc -->
    <circle cx="0" cy="0" r="6" fill="currentColor" />
    <circle cx="0" cy="0" r="2" fill="#070b12" />
  </g>
</svg>
