# YOLOv8 Dataset Configuration for ADLMS
# Absolute paths are best for YOLO, but relative paths starting from YOLO's datasets dir also work.
# We will use paths relative to the project root for training script parsing.

path: data/splits
train: train/images
val: train/images  # For prototyping, we'll use train as val since it's a tiny subset
test: train/images

# Classes
names:
  0: colony
  1: inhibition_zone
  2: antibiotic_disk
  3: empty_plate
